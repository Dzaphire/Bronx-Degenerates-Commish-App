<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fantasy League">
<title>Bronx Degenerates — Fantasy League</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#111827;--bg2:#1f2937;--bg3:#374151;--border:#374151;--border2:#4b5563;--text:#f9fafb;--text2:#d1d5db;--text3:#9ca3af;--accent:#6366f1;--accent2:#818cf8;--green:#16a34a;--red:#e11d48;--amber:#d97706;--teal:#0d9488}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;gap:0;position:sticky;top:0;z-index:100;height:52px}
.logo{font-size:15px;font-weight:700;padding-right:20px;white-space:nowrap;color:var(--text)}
.nav{display:flex;flex:1;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav-btn{padding:0 14px;height:52px;font-size:13px;font-weight:500;border:none;background:none;color:var(--text3);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;flex-shrink:0}
.nav-btn:hover{color:var(--text)}
.nav-btn.active{color:var(--accent2);border-bottom-color:var(--accent2)}
.topbar-right{display:flex;gap:8px;align-items:center;margin-left:auto;padding-left:12px;flex-shrink:0}
.season-bar{background:var(--bg);border-bottom:1px solid var(--border);padding:8px 20px;display:flex;align-items:center;gap:8px;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.season-bar::-webkit-scrollbar{display:none}
.season-select{font-family:inherit;font-size:13px;font-weight:600;padding:6px 12px;border:1px solid var(--border2);border-radius:8px;background:var(--bg2);color:var(--accent2);cursor:pointer;outline:none;max-width:260px}
.season-select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,.15)}
.season-add-btn{padding:5px 12px;font-size:12px;font-weight:600;border-radius:8px;border:1px dashed var(--border2);background:none;color:var(--text3);cursor:pointer;white-space:nowrap}
.season-add-btn:hover{border-color:var(--accent2);color:var(--accent2)}
.content{max-width:1100px;margin:0 auto;padding:20px}
.card{background:var(--bg2);border-radius:12px;border:1px solid var(--border);padding:18px 20px;margin-bottom:14px}
.card-title{font-size:15px;font-weight:600;margin-bottom:14px;color:var(--text)}
.metric{background:var(--bg);border-radius:10px;padding:12px 14px;border:1px solid var(--border)}
.mlabel{font-size:11px;color:var(--text3);margin-bottom:4px;font-weight:500;text-transform:uppercase;letter-spacing:.3px}
.mval{font-size:22px;font-weight:700;color:var(--text)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:8px 12px;font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.3px;border-bottom:1px solid var(--border)}
td{padding:9px 12px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.clickable:hover td{background:var(--bg3);cursor:pointer}
.btn{padding:7px 14px;font-size:13px;font-weight:500;border:1px solid var(--border2);background:var(--bg2);color:var(--text);border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.btn:hover{background:var(--bg3)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{background:#4f46e5}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-red{background:#fff1f2;color:var(--red);border-color:#fca5a5}
.badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px}
.bg{background:#f0fdf4;color:var(--green)}.br{background:#fff1f2;color:var(--red)}.bb{background:#eff6ff;color:#2563eb}.bp{background:#f5f3ff;color:#7c3aed}.ba{background:#fffbeb;color:var(--amber)}.bgray{background:var(--bg3);color:var(--text3)}
label{font-size:12px;font-weight:500;color:var(--text3);display:block;margin-bottom:5px}
input,select,textarea{font-family:inherit;font-size:13px;padding:8px 12px;border:1px solid var(--border2);border-radius:8px;background:var(--bg);color:var(--text);width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,.15)}
.fg{margin-bottom:12px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.sep{height:1px;background:var(--border);margin:16px 0}
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px}
.tag-venmo{background:#dbeafe;color:#1d4ed8}.tag-paypal{background:#f5f3ff;color:#6d28d9}.tag-cash{background:#f0fdf4;color:#15803d}
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;background:rgba(0,0,0,.55);z-index:9998;display:flex;align-items:stretch;justify-content:flex-end}
.modal{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);height:100%;background:var(--bg2);border-left:1px solid var(--border2);z-index:9999;overflow-y:auto;padding:22px;animation:slideInRight .25s cubic-bezier(.4,0,.2,1)}
@keyframes slideInRight{from{transform:translateX(100%)}to{transform:translateX(0)}}
@media(max-width:600px){.modal{top:auto;left:0;right:0;bottom:0;width:100%;height:auto;max-height:88vh;border-left:none;border-top:1px solid var(--border2);border-radius:16px 16px 0 0;animation:slideInUp .25s cubic-bezier(.4,0,.2,1)}@keyframes slideInUp{from{transform:translateY(100%)}to{transform:translateY(0)}}}
.modal-title{font-size:17px;font-weight:600;margin-bottom:16px}
.close-x{position:absolute;top:14px;right:14px;background:none;border:none;font-size:22px;cursor:pointer;color:var(--text3);line-height:1;padding:4px}
.close-x:hover{color:var(--text)}
.week-row{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;gap:16px}
.loading-screen .spinner{width:36px;height:36px;border-width:3px}
.toast-container{position:fixed;bottom:24px;right:24px;z-index:999;display:flex;flex-direction:column;gap:8px}
.toast{background:#1d1d1f;color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;max-width:320px;line-height:1.4;border-left:3px solid var(--accent);animation:slideIn .2s ease}
.toast.error{border-left-color:var(--red)}
.toast.success{border-left-color:var(--green)}
@keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}
.empty-state{text-align:center;padding:48px 20px}
.empty-state .icon{font-size:40px;margin-bottom:14px}
.empty-state h3{font-size:16px;font-weight:600;margin-bottom:8px}
.empty-state p{font-size:13px;color:var(--text3);margin-bottom:20px;line-height:1.6}
.sync-dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--green)}
@media(max-width:640px){.g4{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr}.fr{grid-template-columns:1fr}.content{padding:12px}}

.login-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px}
.login-box{background:var(--bg2);border:1px solid var(--border2);border-radius:20px;padding:40px 36px;width:min(420px,100%);text-align:center}
.login-logo{font-size:48px;margin-bottom:12px}
.login-title{font-size:22px;font-weight:700;margin-bottom:6px;color:var(--text)}
.login-sub{font-size:13px;color:var(--text3);margin-bottom:28px}
.login-input{font-family:inherit;font-size:15px;padding:12px 16px;border:1px solid var(--border2);border-radius:10px;background:var(--bg);color:var(--text);width:100%;outline:none;text-align:center;letter-spacing:2px;margin-bottom:12px}
.login-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,.2)}
.login-btn{width:100%;padding:12px;font-size:15px;font-weight:600;background:var(--accent);color:#fff;border:none;border-radius:10px;cursor:pointer;margin-bottom:10px}
.login-btn:hover{background:#4f46e5}
.login-error{font-size:13px;color:var(--red);min-height:20px;margin-top:4px}
.login-hint{font-size:11px;color:var(--text3);margin-top:16px;line-height:1.6}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

.rules-sidebar{width:200px;flex-shrink:0;padding-right:16px;border-right:1px solid var(--border)}
.rules-sidebar-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;margin-bottom:2px}
.rules-sidebar-item:hover{background:var(--bg3)}
.rules-sidebar-item.active{background:#1e1b4b;color:var(--accent2)}
.rules-main{flex:1;padding-left:20px;min-width:0}
.rule-item-row{padding:12px 14px;border-bottom:1px solid var(--border)}
.rule-item-row:last-child{border-bottom:none}
.rule-item-row:hover{background:var(--bg)}
</style>
</head>
<body>


<div id="login-screen" class="login-screen">
  <div class="login-box">
    <div class="login-logo">🏈</div>
    <div class="login-title">Bronx Degenerates</div>
    <div class="login-sub">Fantasy Football League — Commissioner App</div>
    <input class="login-input" type="password" id="login-pw" placeholder="Enter password"
      onkeydown="if(event.key==='Enter')checkLogin()" autocomplete="current-password">
    <button class="login-btn" onclick="checkLogin()">Enter League</button>
    <div class="login-error" id="login-error"></div>
    <div class="login-hint">Authorized personnel only.<br>Contact the commissioner for access.</div>
  </div>
</div>
<div class="topbar" id="main-app" style="display:none">
  <div class="logo">🏈 <span id="league-title">Bronx Degenerates</span></div>
  <div class="nav" id="main-nav">
    <button class="nav-btn active" onclick="showTab('dashboard')">Dashboard</button>
    <button class="nav-btn" onclick="showTab('teams')">Teams</button>
    <button class="nav-btn" onclick="showTab('results')">Results</button>
    <button class="nav-btn" onclick="showTab('money')">Money</button>
    <button class="nav-btn" onclick="showTab('transactions')">Transactions</button>
    <button class="nav-btn" onclick="showTab('rules')">📋 Rules</button>
    <button class="nav-btn" onclick="showTab('votes')">🗳 Votes</button>
    <button class="nav-btn" onclick="showTab('settings')">Settings</button>
  </div>
  <div class="topbar-right">
    <span class="sync-dot" id="sync-dot" title="Connected"></span>
    <span id="sync-label" style="font-size:11px;color:var(--text3)">Live</span>
    <button class="btn btn-sm" onclick="logout()" style="font-size:11px;padding:4px 10px;margin-left:4px">🔒 Lock</button>
  </div>
</div>

<div class="season-bar" id="season-bar" style="display:none"></div>

<div class="content" id="main-content" style="display:none">
  <div id="tab-dashboard"></div>
  <div id="tab-teams"       style="display:none"></div>
  <div id="tab-results"     style="display:none"></div>
  <div id="tab-money"       style="display:none"></div>
  <div id="tab-transactions"style="display:none"></div>
  <div id="tab-rules"       style="display:none"></div>
  <div id="tab-votes"       style="display:none"></div>
  <div id="tab-settings"    style="display:none"></div>
</div>

<!-- overlay panel is injected dynamically by showOverlay() -->
<div class="toast-container" id="toasts"></div>

<script>
// ── Supabase client ──────────────────────────────────────────────────────────
const SUPA_URL = 'https://tumoekkwdheswwctoomk.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR1bW9la2t3ZGhlc3d3Y3Rvb21rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1NTQ5OTEsImV4cCI6MjA5NTEzMDk5MX0.xXdJCKe3Cp5mYd64cQ7YLaXC1zRGr1YVps5ujCDwkZA';
const sb = supabase.createClient(SUPA_URL, SUPA_KEY);

// ── State ────────────────────────────────────────────────────────────────────
let seasons = [], activeSeason = null;
let teams = [], weekResults = [], transactions = [], votes = [], voteResponses = [];
let currentTab = 'dashboard';
const tabOrder = ['dashboard','teams','results','money','transactions','rules','votes','settings'];

// ── Avatar helpers ───────────────────────────────────────────────────────────
const AV_BG  = ['#f5f3ff','#eff6ff','#f0fdf4','#fffbeb','#fff1f2','#f0fdfa'];
const AV_CLR = ['#7c3aed','#2563eb','#16a34a','#d97706','#e11d48','#0d9488'];
function av(team, sz=34) {
  const i = teams.indexOf(team) % 6;
  const ini = team.name.split(' ').map(p=>p[0]).join('').slice(0,2).toUpperCase();
  return `<div class="avatar" style="width:${sz}px;height:${sz}px;background:${AV_BG[i]};color:${AV_CLR[i]};font-size:${sz<36?11:13}px">${ini}</div>`;
}
function fm(n){return '$'+Number(n||0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',');}
function fd(d){return d?new Date(d+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'—';}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function gtb(id){return teams.find(t=>t.id===id);}

// ── Derived calculations ─────────────────────────────────────────────────────
function teamPaidIn(team){return transactions.filter(t=>t.team_id===team.id&&t.type==='in').reduce((a,t)=>a+Number(t.amount),0);}
function teamPaidOut(team){return transactions.filter(t=>t.team_id===team.id&&t.type==='out').reduce((a,t)=>a+Number(t.amount),0);}
function teamWinnings(team){
  if(!activeSeason) return 0;
  let w=0;
  weekResults.forEach(r=>{if(r.winner_team_id===team.id)w+=Number(activeSeason.weekly_payout);});
  // Championship payouts — use split amount if a split was agreed
  if(activeSeason.champion_team_id===team.id){
    w+=activeSeason.champion_split && Number(activeSeason.champion_split_amount)>0
      ? Number(activeSeason.champion_split_amount)
      : Number(activeSeason.champion_payout);
  }
  if(activeSeason.second_team_id===team.id){
    w+=activeSeason.second_split && Number(activeSeason.second_split_amount)>0
      ? Number(activeSeason.second_split_amount)
      : Number(activeSeason.second_payout);
  }
  if(activeSeason.third_team_id===team.id){
    w+=activeSeason.third_split && Number(activeSeason.third_split_amount)>0
      ? Number(activeSeason.third_split_amount)
      : Number(activeSeason.third_payout);
  }
  return w;
}
function teamWeekWins(team){return weekResults.filter(r=>r.winner_team_id===team.id).length;}
function netOwed(team){return(Number(activeSeason.entry_fee)-teamPaidIn(team))-(teamWinnings(team)-teamPaidOut(team));}
function totalIn(){return transactions.filter(t=>t.type==='in').reduce((a,t)=>a+Number(t.amount),0);}
function totalOut(){return transactions.filter(t=>t.type==='out').reduce((a,t)=>a+Number(t.amount),0);}
function netBadge(net){
  if(net>0.005) return `<span class="badge br">Owes ${fm(net)}</span>`;
  if(net<-0.005) return `<span class="badge bg">Credit ${fm(-net)}</span>`;
  return `<span class="badge bg">Settled</span>`;
}

// ── Sync indicator ───────────────────────────────────────────────────────────
function setSyncing(busy){
  const dot=document.getElementById('sync-dot');
  const lbl=document.getElementById('sync-label');
  if(!dot) return;
  dot.style.background=busy?'#ff9500':'#34c759';
  lbl.textContent=busy?'Saving…':'Live';
}

// ── Load all data for active season ─────────────────────────────────────────
async function loadSeasonData(seasonId){
  setSyncing(true);
  try {
    const [t,wr,tx,v,vr] = await Promise.all([
      sb.from('teams').select('*').eq('season_id',seasonId).order('created_at'),
      sb.from('week_results').select('*').eq('season_id',seasonId),
      sb.from('transactions').select('*').eq('season_id',seasonId).order('tx_date',{ascending:false}),
      sb.from('votes').select('*').eq('season_id',seasonId).order('created_at'),
      sb.from('vote_responses').select('*'),
    ]);
    teams         = t.data  || [];
    weekResults   = wr.data || [];
    transactions  = tx.data || [];
    votes         = v.data  || [];
    voteResponses = vr.data || [];
  } catch(e){ showToast('Error loading data: '+e.message,'error'); }
  setSyncing(false);
}

async function loadSeasons(){
  const {data,error}=await sb.from('seasons').select('*').order('created_at',{ascending:false});
  if(error){showToast('Could not load seasons: '+error.message,'error');return;}
  seasons=data||[];
  // Always default to the most recent season (first in descending order)
  if(seasons.length>0) activeSeason=seasons[0];
}

// ── Init ─────────────────────────────────────────────────────────────────────
async function init(){
  document.getElementById('tab-dashboard').innerHTML=`<div class="loading-screen"><div class="spinner"></div><div style="color:var(--text3);font-size:14px">Connecting to database…</div></div>`;
  await loadSeasons();
  if(activeSeason){
    await loadSeasonData(activeSeason.id);
    renderSeasonBar();
    renderDash();
  } else {
    document.getElementById('tab-dashboard').innerHTML=`<div class="empty-state"><div class="icon">🏈</div><h3>No seasons yet</h3><p>Create your first season to get started.</p><button class="btn btn-primary" onclick="openNewSeasonModal()">+ Create season</button></div>`;
    renderSeasonBar();
  }
}

// ── Season bar ───────────────────────────────────────────────────────────────
function renderSeasonBar(){
  const bar=document.getElementById('season-bar');
  // Sort newest first (by created_at descending)
  const sorted=[...seasons].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  const opts=sorted.map(s=>`<option value="${s.id}"${s.id===activeSeason?.id?' selected':''}>${esc(s.name)}</option>`).join('');
  bar.innerHTML=`<span style="font-size:12px;font-weight:500;color:var(--text3);flex-shrink:0">Season</span>`
    +`<select class="season-select" onchange="switchSeason(this.value)" aria-label="Select season">${opts}</select>`
    +`<button class="season-add-btn" onclick="openNewSeasonModal()">+ New season</button>`;
}

async function switchSeason(id){
  activeSeason=seasons.find(s=>s.id===id);
  renderSeasonBar();
  showTab(currentTab,true);
}

// ── Tab routing ──────────────────────────────────────────────────────────────
const tabRenders={dashboard:renderDash,teams:renderTeams,results:renderResults,money:renderMoney,transactions:renderTx,rules:renderRules,votes:renderVotes,settings:renderSettings};
async function showTab(name, reload=false){
  if(!activeSeason && name!=='settings'){
    document.getElementById('tab-'+name).innerHTML=`<div class="empty-state"><div class="icon">🏈</div><h3>No season selected</h3><p>Create a season first.</p><button class="btn btn-primary" onclick="openNewSeasonModal()">+ Create season</button></div>`;
    tabOrder.forEach((t,i)=>{document.getElementById('tab-'+t).style.display='none';document.querySelectorAll('.nav-btn')[i].classList.remove('active');});
    document.getElementById('tab-'+name).style.display='block';
    document.querySelectorAll('.nav-btn')[tabOrder.indexOf(name)].classList.add('active');
    currentTab=name; return;
  }
  tabOrder.forEach((t,i)=>{document.getElementById('tab-'+t).style.display='none';document.querySelectorAll('.nav-btn')[i].classList.remove('active');});
  document.getElementById('tab-'+name).style.display='block';
  document.querySelectorAll('.nav-btn')[tabOrder.indexOf(name)].classList.add('active');
  currentTab=name;
  if(reload){
    document.getElementById('tab-'+name).innerHTML=`<div class="loading-screen"><div class="spinner"></div></div>`;
    await loadSeasonData(activeSeason.id);
  }
  tabRenders[name]();
}

// ── DASHBOARD ────────────────────────────────────────────────────────────────
function renderDash(){
  const el=document.getElementById('tab-dashboard');
  const pool=teams.length*Number(activeSeason.entry_fee);
  const col=totalIn(), out=totalOut();
  const rows=teams.map(t=>{
    const wn=teamWinnings(t),pi=teamPaidIn(t),net=netOwed(t),wi=teamWeekWins(t);
    let pos='';
    if(activeSeason.champion_team_id===t.id) pos+=`<span class="badge ba" style="margin-right:3px">🏆 Champ</span>`;
    if(activeSeason.second_team_id===t.id)   pos+=`<span class="badge bb" style="margin-right:3px">2nd</span>`;
    if(activeSeason.third_team_id===t.id)    pos+=`<span class="badge bp" style="margin-right:3px">3rd</span>`;
    if(wi>0) pos+=`<span class="badge bgray">${wi}W</span>`;
    return `<tr class="clickable" onclick="openTeamModal('${t.id}')">
      <td><div style="display:flex;align-items:center;gap:10px">${av(t)}<div><div style="font-weight:600">${esc(t.name)}</div><div style="font-size:11px;color:var(--text3)">${esc(t.owner1)}${t.owner2?' & '+esc(t.owner2):''}</div></div></div></td>
      <td>${pos||'<span style="color:var(--border2)">—</span>'}</td>

async function toggleSplit(pos, splitField, splitAmtField, isChecked){
  setSyncing(true);
  const defaultAmts = {champion_split_amount: activeSeason.champion_payout, second_split_amount: activeSeason.second_payout, third_split_amount: activeSeason.third_payout};
  const updates = {[splitField]: isChecked, [splitAmtField]: isChecked ? (activeSeason[splitAmtField]||defaultAmts[splitAmtField]) : null};
  await sb.from('seasons').update(updates).eq('id', activeSeason.id);
  Object.assign(activeSeason, updates);
  seasons = seasons.map(s=>s.id===activeSeason.id?{...activeSeason}:s);
  setSyncing(false);
  renderResults();
}

async function saveSplitAmount(splitAmtField, value){
  const amt = parseFloat(value);
  if(isNaN(amt)||amt<0) return;
  setSyncing(true);
  await sb.from('seasons').update({[splitAmtField]: amt}).eq('id', activeSeason.id);
  activeSeason[splitAmtField] = amt;
  seasons = seasons.map(s=>s.id===activeSeason.id?{...activeSeason}:s);
  setSyncing(false);
}

async function setWeekWinner(week,teamId){
  setSyncing(true);
  const existing=weekResults.find(r=>r.week_number===week);
  if(teamId){
    if(existing){
      await sb.from('week_results').update({winner_team_id:teamId}).eq('id',existing.id);
    } else {
      await sb.from('week_results').insert({season_id:activeSeason.id,week_number:week,winner_team_id:teamId});
    }
  } else if(existing){
    await sb.from('week_results').delete().eq('id',existing.id);
  }
  await loadSeasonData(activeSeason.id);
  setSyncing(false);
  renderResults();
}

async function setStanding(field,teamId){
  setSyncing(true);
  await sb.from('seasons').update({[field]:teamId||null}).eq('id',activeSeason.id);
  activeSeason[field]=teamId||null;
  seasons=seasons.map(s=>s.id===activeSeason.id?{...activeSeason}:s);
  setSyncing(false);
  renderResults();
}

// ── MONEY ────────────────────────────────────────────────────────────────────
function renderMoney(){
  const el=document.getElementById('tab-money');
  const col=totalIn(),out=totalOut(),pool=teams.length*Number(activeSeason.entry_fee);

  // ── Net settlement per team ──────────────────────────────────────────────
  // net > 0 → they owe you (collect)
  // net < 0 → you owe them (send)
  // net = 0 → settled
  const settleTbody=teams.map(t=>{
    const fee=Number(activeSeason.entry_fee);
    const pi=teamPaidIn(t);        // cash already received from them
    const wn=teamWinnings(t);      // total winnings earned
    const po=teamPaidOut(t);       // cash already sent to them
    // What they still owe on entry fee
    const feeBalance=fee-pi;
    // What we still owe them in winnings
    const winBalance=wn-po;
    // Net: positive = collect from them, negative = send to them
    const net=feeBalance-winBalance;

    let actionBtn='';
    let statusCell='';
    let netDisplay='';

    if(Math.abs(net)<0.005){
      // Fully settled
      statusCell=`<span class="badge bg">✓ Settled</span>`;
      netDisplay=`<span style="color:var(--text3);font-weight:600">$0.00</span>`;
      actionBtn=`<button class="btn btn-sm" onclick="openPayInModal('${t.id}')">+ Payment in</button>
                 <button class="btn btn-sm" onclick="openPayOutModal('${t.id}')" style="margin-left:4px">+ Payout out</button>`;
    } else if(net>0){
      // They owe you — collect
      statusCell=`<span class="badge br">Collect</span>`;
      netDisplay=`<span style="color:var(--red);font-weight:700;font-size:15px">Collect ${fm(net)}</span>`;
      actionBtn=`<button class="btn btn-sm btn-primary" onclick="openSettleCollectModal('${t.id}',${net.toFixed(2)})">Record collection</button>`;
    } else {
      // You owe them — send
      statusCell=`<span class="badge" style="background:#1e1b4b;color:var(--accent2)">Send</span>`;
      netDisplay=`<span style="color:var(--accent2);font-weight:700;font-size:15px">Send ${fm(-net)}</span>`;
      actionBtn=`<button class="btn btn-sm" style="background:#1e1b4b;color:var(--accent2);border-color:var(--accent)" onclick="openSettleSendModal('${t.id}',${(-net).toFixed(2)})">Record payout</button>`;
    }

    return `<tr>
      <td>
        <div style="font-weight:600">${esc(t.name)}</div>
        <div style="font-size:11px;color:var(--text3)">${esc(t.owner1)}${t.owner2?' & '+esc(t.owner2):''}</div>
      </td>
      <td style="color:#818cf8;font-weight:600">${fm(fee)}</td>
      <td style="color:var(--green);font-weight:600">${fm(pi)}</td>
      <td style="color:#818cf8;font-weight:600">${fm(wn)}</td>
      <td style="color:var(--red);font-weight:600">${fm(po)}</td>
      <td>${netDisplay}</td>
      <td>${statusCell}</td>
      <td style="white-space:nowrap">${actionBtn}</td>
    </tr>`;
  }).join('');

  // ── Summary metrics ──────────────────────────────────────────────────────
  const totalToCollect = teams.reduce((a,t)=>{ const n=netOwed(t); return a+(n>0?n:0); },0);
  const totalToSend    = teams.reduce((a,t)=>{ const n=netOwed(t); return a+(n<0?-n:0); },0);
  const fullySettled   = teams.filter(t=>Math.abs(netOwed(t))<0.005).length;

  el.innerHTML=`
  <div class="g4" style="margin-bottom:14px">
    <div class="metric"><div class="mlabel">Total pool</div><div class="mval">${fm(pool)}</div></div>
    <div class="metric"><div class="mlabel">Still to collect</div><div class="mval" style="color:var(--red)">${fm(totalToCollect)}</div></div>
    <div class="metric"><div class="mlabel">Still to send out</div><div class="mval" style="color:var(--accent2)">${fm(totalToSend)}</div></div>
    <div class="metric"><div class="mlabel">Teams settled</div><div class="mval" style="color:var(--green)">${fullySettled} / ${teams.length}</div></div>
  </div>

  <div class="card" style="margin-bottom:14px;background:#111827;border-color:var(--border2)">
    <div style="font-size:12px;color:var(--text3);line-height:1.8">
      <strong style="color:var(--text)">How net settlement works:</strong>
      Each team's <strong style="color:#818cf8">entry fee</strong> minus their <strong style="color:var(--green)">payments already made</strong>
      minus their <strong style="color:#818cf8">winnings earned</strong> plus any <strong style="color:var(--red)">payouts already sent</strong>
      = their net position.<br>
      <span style="color:var(--red)">Red = collect from them.</span>
      <span style="color:var(--accent2);margin-left:8px">Purple = send to them.</span>
      <span style="color:var(--green);margin-left:8px">Green = settled.</span>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Net settlement — all teams</div>
    ${teams.length
      ? `<div style="overflow-x:auto"><table>
          <thead><tr>
            <th>Team</th>
            <th>Entry fee</th>
            <th>Paid in</th>
            <th>Winnings</th>
            <th>Paid out</th>
            <th>Net</th>
            <th>Status</th>
            <th></th>
          </tr></thead>
          <tbody>${settleTbody}</tbody>
        </table></div>`
      : '<div class="empty-state"><div class="icon">💸</div><h3>No teams yet</h3></div>'}
  </div>

  <div class="card">
    <div class="card-title">Record a transaction manually</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      ${teams.map(t=>`
        <div style="background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px 14px;flex:1;min-width:180px">
          <div style="font-weight:600;margin-bottom:8px;font-size:13px">${esc(t.name)}</div>
          <div style="display:flex;gap:6px">
            <button class="btn btn-sm" onclick="openPayInModal('${t.id}')" style="flex:1;font-size:11px">+ In</button>
            <button class="btn btn-sm" onclick="openPayOutModal('${t.id}')" style="flex:1;font-size:11px">− Out</button>
          </div>
        </div>`).join('')}
    </div>
  </div>`;
}

// ── TRANSACTIONS ─────────────────────────────────────────────────────────────
// active filter for transactions: 'all','in','out','expense'
let txFilter = 'all';

function renderTx(){
  const el=document.getElementById('tab-transactions');
  const filtered = txFilter==='all'
    ? transactions
    : txFilter==='expense'
      ? transactions.filter(tx=>tx.type==='expense')
      : transactions.filter(tx=>tx.type===txFilter);

  const totalIn  = transactions.filter(t=>t.type==='in').reduce((a,t)=>a+Number(t.amount),0);
  const totalOut = transactions.filter(t=>t.type==='out').reduce((a,t)=>a+Number(t.amount),0);
  const expOut   = transactions.filter(t=>t.type==='expense'&&t.amount<0).reduce((a,t)=>a+Number(t.amount),0);
  const expIn    = transactions.filter(t=>t.type==='expense'&&t.amount>0).reduce((a,t)=>a+Number(t.amount),0);
  const expNet   = expIn+expOut;

  function filterTab(val,label){
    const on=txFilter===val;
    const isExp=val==='expense';
    return '<button onclick="txFilter=\''+val+'\';renderTx()" style="padding:5px 13px;font-size:12px;font-weight:500;border-radius:20px;border:1px solid '+(on?(isExp?'#713f12':'var(--accent)'):'var(--border2)')+';background:'+(on?(isExp?'#1a1200':'#1e1b4b'):'var(--bg2)')+';color:'+(on?(isExp?'#fbbf24':'var(--accent2)'):'var(--text3)')+';cursor:pointer">'+label+'</button>';
  }

  const sorted=[...filtered].sort((a,b)=>new Date(b.tx_date)-new Date(a.tx_date));

  const rows=sorted.map(tx=>{
    const t=gtb(tx.team_id);
    const isExp=tx.type==='expense';
    const mc=tx.method==='Cash'?'tag-cash':tx.method==='PayPal'?'tag-paypal':'tag-venmo';
    const amtColor=isExp?'#fbbf24':tx.type==='in'?'var(--green)':'var(--red)';
    const amtSign=Number(tx.amount)>=0?'+':'';
    const rowBg=isExp?'background:#1a150a;':'';
    const typeBadge=isExp
      ?'<span style="font-size:10px;font-weight:600;padding:2px 7px;border-radius:10px;background:#1a1200;color:#fbbf24">Expense</span>'

      :'<div style="font-weight:600;font-size:13px">'+(t?esc(t.name):'—')+'</div>'+(tx.note&&!isExp?'<div style="font-size:11px;color:var(--text3)">'+esc(tx.note)+'</div>':'');

          +'<tbody>'+rows+'</tbody>'
          +'</table></div>'
        :'<div class="empty-state" style="padding:32px"><div class="icon">💸</div>'
          +'<h3>'+(txFilter==='all'?'No transactions yet':'No '+txFilter+' transactions')+'</h3>'

      +'<div class="metric"><div class="mlabel">Total payments in</div><div class="mval" style="color:var(--green)">'+fm(totalIn)+'</div></div>'
      +'<div class="metric"><div class="mlabel">Total paid out</div><div class="mval" style="color:var(--red)">'+fm(totalOut)+'</div></div>'
      +'<div class="metric" style="background:#1a150a;border-color:#713f12">'
        +'<div class="mlabel" style="color:#a16207">Expenses net</div>'
        +'<div class="mval" style="color:'+(Math.abs(expNet)<0.01?'var(--green)':'#fbbf24')+'">'+(expNet>=0?'+':'')+fm(expNet)+'</div>'
        +'<div style="font-size:11px;color:#a16207;margin-top:3px">'+(Math.abs(expNet)<0.01?'Fully replenished':'Needs replenishing')+'</div>'
      +'</div>'

    +'<div style="font-size:11px;color:var(--text3);margin-top:8px;line-height:1.6">Tap any row to edit or delete. Expenses shown in amber — record the outflow as a negative, then a matching positive when funds are replenished. The net tells you if anything is still outstanding.</div>';
}

let rulesData = [];
let activeRuleSection = null;

async function loadRulesData(){
  const [sections, items] = await Promise.all([
    sb.from('rule_sections').select('*').order('position'),
    sb.from('rule_items').select('*').order('position'),
  ]);
  rulesData = (sections.data||[]).map(s=>({
    ...s,
    items:(items.data||[]).filter(i=>i.section_id===s.id)
  }));
  if(rulesData.length && !activeRuleSection) activeRuleSection=rulesData[0].id;
}

function renderRules(){
  const el=document.getElementById('tab-rules');
  el.innerHTML=`<div class="loading-screen"><div class="spinner"></div></div>`;
  loadRulesData().then(()=>{
    if(!rulesData.length){
      el.innerHTML=`<div class="empty-state"><div class="icon">📋</div><h3>No rules yet</h3><p>Create your first rule section — e.g. Keeper rules, Scoring, Trades.</p><button class="btn btn-primary" onclick="openAddSectionModal()">+ Add first section</button></div>`;
      return;
    }
    buildRulesUI(el);
  });
}

function buildRulesUI(el){
  const section=rulesData.find(s=>s.id===activeRuleSection)||rulesData[0];
  activeRuleSection=section?.id||null;
  const sidebarItems=rulesData.map(s=>`
    <div class="rules-sidebar-item${s.id===activeRuleSection?' active':''}" onclick="activeRuleSection='${s.id}';buildRulesUI(document.getElementById('tab-rules'))">
      <span style="font-size:16px">${s.emoji||'📋'}</span>
      <span style="flex:1;font-size:13px;font-weight:${s.id===activeRuleSection?500:400}">${esc(s.title)}</span>
      <span style="font-size:11px;color:var(--text3)">${s.items?.length||0}</span>
    </div>`).join('');
  const items=section?.items||[];
  const ruleRows=items.map((item,i)=>`
    <div class="rule-item-row">
      <div style="display:flex;align-items:flex-start;gap:10px">
        <span style="font-size:12px;font-weight:600;color:var(--accent2);min-width:22px;margin-top:2px">${i+1}.</span>
        <div style="flex:1">
          <div style="font-size:13px;color:var(--text);line-height:1.6">${esc(item.body)}</div>
          ${item.note?`<div style="font-size:12px;color:var(--text3);margin-top:5px;padding:6px 10px;background:var(--bg);border-left:2px solid var(--border2);border-radius:0 4px 4px 0;line-height:1.6">${esc(item.note)}</div>`:''}
        </div>
        <div style="display:flex;gap:4px;flex-shrink:0">
          <button class="btn btn-sm" style="padding:3px 8px;font-size:11px" onclick="openEditRuleModal('${section.id}','${item.id}')">✏️</button>
          <button class="btn btn-sm" style="padding:3px 8px;font-size:11px;color:var(--red);border-color:var(--red)" onclick="deleteRule('${section.id}','${item.id}')">🗑</button>
        </div>
      </div>
    </div>`).join('');
  el.innerHTML=`
  <div style="display:flex;gap:0;min-height:500px">
    <div class="rules-sidebar">
      <div style="font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;padding:0 4px">Sections</div>
      ${sidebarItems}
      <button class="btn btn-sm" style="width:100%;margin-top:10px;border-style:dashed;font-size:12px;color:var(--text3)" onclick="openAddSectionModal()">+ New section</button>
    </div>
    <div class="rules-main">
      ${section?`
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px;flex-wrap:wrap">
        <div style="display:flex;align-items:center;gap:10px">
          <span style="font-size:26px">${section.emoji||'📋'}</span>
          <div>
            <div style="font-size:17px;font-weight:600;color:var(--text)">${esc(section.title)}</div>
            <div style="font-size:12px;color:var(--text3)">${items.length} rule${items.length!==1?'s':''}</div>
          </div>
        </div>
        <div style="display:flex;gap:6px">
          <button class="btn btn-sm" onclick="openEditSectionModal('${section.id}')">✏️ Edit section</button>
          <button class="btn btn-sm" style="color:var(--red);border-color:var(--red)" onclick="deleteSection('${section.id}')">🗑 Delete</button>
        </div>
      </div>
      ${section.description?`<div style="font-size:13px;color:var(--text3);margin-bottom:14px;line-height:1.6;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px">${esc(section.description)}</div>`:''}
      <div class="card" style="padding:0;overflow:hidden;margin-bottom:12px">
        ${items.length?`<div>${ruleRows}</div>`:`<div style="text-align:center;padding:32px 20px;color:var(--text3);font-size:13px">No rules yet — add your first one below.</div>`}
      </div>
      <button class="btn btn-primary" onclick="openAddRuleModal('${section.id}')" style="width:100%">+ Add rule</button>
      `:`<div class="empty-state"><div class="icon">📋</div><h3>Select a section</h3></div>`}
    </div>
  </div>`;
}

function openAddSectionModal(){
  showOverlay(`<button class="close-x" onclick="closeOverlay()">×</button>
    <div class="modal-title">Add rule section</div>
    <div class="fg"><label>Section title</label><input id="rs-title" placeholder="e.g. Keeper rules"></div>
    <div class="fg"><label>Emoji icon</label><input id="rs-emoji" placeholder="🔑" style="width:90px"></div>
    <div class="fg"><label>Description (optional)</label><textarea id="rs-desc" rows="2" placeholder="Brief explanation of this rule section"></textarea></div>
    <button class="btn btn-primary" onclick="submitAddSection()" style="width:100%;margin-top:4px">Create section</button>`);
}

async function submitAddSection(){
  const title=document.getElementById('rs-title').value.trim();
  if(!title){alert('Title required');return;}
  setSyncing(true);
  const {data,error}=await sb.from('rule_sections').insert({
    title,
    emoji:document.getElementById('rs-emoji').value.trim()||'📋',
    description:document.getElementById('rs-desc').value.trim(),
    position:rulesData.length
  }).select().single();
  if(error){showToast('Error: '+error.message,'error');}
  else{activeRuleSection=data.id;closeOverlay();showToast('Section added','success');renderRules();}
  setSyncing(false);
}

function openEditSectionModal(sectionId){
  const s=rulesData.find(x=>x.id===sectionId);if(!s)return;
  showOverlay(`<button class="close-x" onclick="closeOverlay()">×</button>
    <div class="modal-title">Edit section</div>
    <div class="fg"><label>Section title</label><input id="rs-title" value="${esc(s.title)}"></div>
    <div class="fg"><label>Emoji icon</label><input id="rs-emoji" value="${esc(s.emoji||'📋')}" style="width:90px"></div>
    <div class="fg"><label>Description (optional)</label><textarea id="rs-desc" rows="2">${esc(s.description||'')}</textarea></div>
    <div style="display:flex;gap:8px;margin-top:4px">
      <button class="btn btn-primary" onclick="submitEditSection('${sectionId}')" style="flex:1">Save changes</button>
      <button class="btn" onclick="closeOverlay()" style="flex:1">Cancel</button>
    </div>`);
}

async function submitEditSection(sectionId){
  const title=document.getElementById('rs-title').value.trim();
  if(!title){alert('Title required');return;}
  setSyncing(true);
  const {error}=await sb.from('rule_sections').update({
    title,
    emoji:document.getElementById('rs-emoji').value.trim()||'📋',
    description:document.getElementById('rs-desc').value.trim()
  }).eq('id',sectionId);
  if(error){showToast('Error: '+error.message,'error');}
  else{closeOverlay();showToast('Section updated','success');renderRules();}
  setSyncing(false);
}

async function deleteSection(sectionId){
  const s=rulesData.find(x=>x.id===sectionId);
  if(!confirm('Delete "'+( s?.title||'this section')+'" and all its rules? This cannot be undone.'))return;
  setSyncing(true);
  await sb.from('rule_sections').delete().eq('id',sectionId);
  activeRuleSection=null;
  showToast('Section deleted');renderRules();
  setSyncing(false);
}

function openAddRuleModal(sectionId){
  const s=rulesData.find(x=>x.id===sectionId);
  showOverlay(`<button class="close-x" onclick="closeOverlay()">×</button>
    <div class="modal-title">Add rule — ${esc(s?.title||'')}</div>
    <div class="fg"><label>Rule text</label><textarea id="ri-body" rows="3" placeholder="Describe the rule clearly and completely"></textarea></div>
    <div class="fg"><label>Sub-note or clarification (optional)</label><textarea id="ri-note" rows="2" placeholder="e.g. This only applies to playoff weeks"></textarea></div>
    <button class="btn btn-primary" onclick="submitAddRule('${sectionId}')" style="width:100%;margin-top:4px">Add rule</button>`);
}

async function submitAddRule(sectionId){
  const body=document.getElementById('ri-body').value.trim();
  if(!body){alert('Rule text required');return;}
  setSyncing(true);
  const section=rulesData.find(s=>s.id===sectionId);
  const {error}=await sb.from('rule_items').insert({
    section_id:sectionId,
    body,
    note:document.getElementById('ri-note').value.trim(),
    position:section?.items?.length||0
  });
  if(error){showToast('Error: '+error.message,'error');}
  else{closeOverlay();showToast('Rule added','success');renderRules();}
  setSyncing(false);
}

function openEditRuleModal(sectionId,itemId){
  const section=rulesData.find(s=>s.id===sectionId);
  const item=section?.items?.find(i=>i.id===itemId);
  if(!item)return;
  showOverlay(`<button class="close-x" onclick="closeOverlay()">×</button>
    <div class="modal-title">Edit rule</div>
    <div class="fg"><label>Rule text</label><textarea id="ri-body" rows="3">${esc(item.body)}</textarea></div>
    <div class="fg"><label>Sub-note or clarification (optional)</label><textarea id="ri-note" rows="2">${esc(item.note||'')}</textarea></div>
    <div style="display:flex;gap:8px;margin-top:4px">
      <button class="btn btn-primary" onclick="submitEditRule('${itemId}')" style="flex:1">Save changes</button>
      <button class="btn" onclick="closeOverlay()" style="flex:1">Cancel</button>
    </div>`);
}

async function submitEditRule(itemId){
  const body=document.getElementById('ri-body').value.trim();
  if(!body){alert('Rule text required');return;}
  setSyncing(true);
  const {error}=await sb.from('rule_items').update({
    body,
    note:document.getElementById('ri-note').value.trim()
  }).eq('id',itemId);
  if(error){showToast('Error: '+error.message,'error');}
  else{closeOverlay();showToast('Rule updated','success');renderRules();}
  setSyncing(false);
}

async function deleteRule(sectionId,itemId){
  if(!confirm('Delete this rule?'))return;
  setSyncing(true);
  await sb.from('rule_items').delete().eq('id',itemId);
  showToast('Rule deleted');renderRules();
  setSyncing(false);
}

function renderVotes(){
  const el=document.getElementById('tab-votes');
  if(!votes.length){
    el.innerHTML=`<div class="empty-state"><div class="icon">🗳️</div><h3>No votes yet</h3><p>Create a question for the league to vote on.</p><button class="btn btn-primary" onclick="openNewVoteModal()">+ Create first vote</button></div>`;
    return;
  }
  const cards=votes.map(v=>buildVoteCard(v)).join('');
  el.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
    <h2 style="font-size:18px;font-weight:600">League votes</h2>
    <button class="btn btn-primary" onclick="openNewVoteModal()">+ New vote</button></div>${cards}`;
}

function buildVoteCard(v){
  const myResponses=voteResponses.filter(r=>r.vote_id===v.id);
  const votedCount=myResponses.length,totalTeams=teams.length,pending=totalTeams-votedCount;
  const opts=v.options||[];
  const tally={};opts.forEach(o=>{tally[o]=0;});
  myResponses.forEach(r=>{if(tally[r.answer]!==undefined)tally[r.answer]++;});
  const maxVotes=Math.max(...Object.values(tally),1);
  const optBars=opts.map(opt=>{
    const count=tally[opt]||0,pct=votedCount>0?Math.round(count/votedCount*100):0,barW=Math.round(count/maxVotes*100),isWin=count===maxVotes&&count>0;
    return `<div style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;margin-bottom:4px">
        <span style="font-size:13px;color:${isWin?'var(--text)':'var(--text2)'};font-weight:${isWin?600:400}">${esc(opt)}</span>
        <span style="font-size:12px;color:var(--text3);font-weight:600">${count} vote${count!==1?'s':''} (${pct}%)</span></div>
      <div style="height:8px;background:var(--bg3);border-radius:4px;overflow:hidden">
        <div style="height:100%;width:${barW}%;background:${isWin?'var(--accent)':'var(--border2)'};border-radius:4px;transition:width .3s"></div></div></div>`;
  }).join('');
  const voteLog=teams.map(t=>{
    const resp=myResponses.find(r=>r.team_id===t.id);
    return `<div style="display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bg)">
      <span style="font-size:12px;color:var(--text2)">${esc(t.name)}</span>
      ${resp?`<span style="font-size:11px;font-weight:600;background:#1e1b4b;color:var(--accent2);padding:2px 8px;border-radius:10px">${esc(resp.answer)}</span>`
            :`<span style="font-size:11px;color:var(--border2);font-style:italic">Not voted</span>`}</div>`;
  }).join('');
  return `<div class="card" style="margin-bottom:14px">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px">
      <div style="flex:1">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
          <span style="width:8px;height:8px;border-radius:50%;background:${v.closed?'var(--text3)':'var(--green)'};display:inline-block"></span>
          <span style="font-size:11px;font-weight:600;color:${v.closed?'var(--text3)':'var(--green)'};text-transform:uppercase;letter-spacing:.5px">${v.closed?'Closed':'Open'}</span>
          ${v.category?`<span style="font-size:11px;background:var(--bg3);color:var(--text3);padding:2px 8px;border-radius:10px;border:1px solid var(--border)">${esc(v.category)}</span>`:''}
        </div>
        <div style="font-size:16px;font-weight:600;margin-bottom:4px">${esc(v.question)}</div>
        ${v.description?`<div style="font-size:12px;color:var(--text3);line-height:1.5">${esc(v.description)}</div>`:''}
      </div>
      <div style="display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end">
        ${!v.closed?`<button class="btn btn-sm" onclick="openRecordVoteModal('${v.id}')">Record vote</button>`:''}
        <button class="btn btn-sm" onclick="openEditVoteModal('${v.id}')">✏️</button>
        <button class="btn btn-sm" onclick="toggleVoteClosed('${v.id}',${!v.closed})">${v.closed?'🔓':'🔒'}</button>
        <button class="btn btn-sm" style="color:var(--red);border-color:var(--red)" onclick="deleteVote('${v.id}')">🗑</button>
      </div></div>
    <div class="g3" style="margin-bottom:14px">
      <div class="metric"><div class="mlabel">Voted</div><div style="font-size:20px;font-weight:700;color:var(--green)">${votedCount} / ${totalTeams}</div></div>
      <div class="metric"><div class="mlabel">Pending</div><div style="font-size:20px;font-weight:700;color:${pending>0?'var(--amber)':'var(--text3)'}">${pending}</div></div>
      <div class="metric"><div class="mlabel">Options</div><div style="font-size:20px;font-weight:700">${opts.length}</div></div>
    </div>
    <div style="margin-bottom:14px">
      <div style="font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;margin-bottom:10px">Results</div>
      ${votedCount?optBars:`<div style="font-size:13px;color:var(--border2);font-style:italic">No votes recorded yet</div>`}
    </div>
    <details><summary style="font-size:12px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;list-style:none;cursor:pointer;user-select:none">▶ Vote log by team</summary>
      <div style="margin-top:10px">${voteLog}</div></details>
  </div>`;
}

function showOverlay(html){
  // Remove any existing overlay
  const existing=document.getElementById('overlay');
  if(existing){existing.remove();}
  // Create fresh overlay attached directly to body
  const ov=document.createElement('div');
  ov.id='overlay';
  ov.className='overlay';
  ov.innerHTML=`<div class="modal">${html}</div>`;
  document.body.appendChild(ov);
  // Clicking dark area closes panel
  ov.addEventListener('click',function(e){if(e.target===ov)closeOverlay();});
  // Prevent panel itself from closing
  ov.querySelector('.modal').addEventListener('click',function(e){e.stopPropagation();});
  // Lock body scroll while panel is open
  document.body.style.overflow='hidden';
}
function closeOverlay(){
  const ov=document.getElementById('overlay');
  if(ov){ov.remove();}
  document.body.style.overflow='';
}

    <div class="modal-title">Create new vote</div>
    <div class="fg"><label>Question / proposal</label><input id="nv-q" placeholder="e.g. Should we add a trade deadline?"></div>

async function submitNewVote(){

  if(!q){alert('Please enter a question');return;}
  if(opts.length<2){alert('Please enter at least 2 options');return;}
  setSyncing(true);
  const {error}=await sb.from('votes').insert({season_id:activeSeason.id,question:q,description:document.getElementById('nv-desc').value.trim(),category:document.getElementById('nv-cat').value.trim(),options:opts,closed:false});
  if(error){showToast('Error: '+error.message,'error');}
  else{showToast('Vote created','success');closeOverlay();await loadSeasonData(activeSeason.id);renderVotes();}
  setSyncing(false);
}

function openEditVoteModal(voteId){
  const v=votes.find(x=>x.id===voteId);if(!v)return;

    <div class="modal-title">Edit vote</div>
    <div class="fg"><label>Question</label><input id="ev-q" value="${esc(v.question)}"></div>
    <div class="fg"><label>Description</label><input id="ev-desc" value="${esc(v.description||'')}"></div>

async function submitEditVote(voteId){
  const q=document.getElementById('ev-q').value.trim();
  const opts=document.getElementById('ev-opts').value.split('\n').map(o=>o.trim()).filter(Boolean);
  if(!q||opts.length<2){alert('Question and at least 2 options required');return;}
  setSyncing(true);
  const {error}=await sb.from('votes').update({question:q,description:document.getElementById('ev-desc').value.trim(),category:document.getElementById('ev-cat').value.trim(),options:opts}).eq('id',voteId);
  if(error){showToast('Error: '+error.message,'error');}
  else{showToast('Vote updated','success');closeOverlay();await loadSeasonData(activeSeason.id);renderVotes();}
  setSyncing(false);
}

function openRecordVoteModal(voteId){
  const v=votes.find(x=>x.id===voteId);if(!v)return;
  const opts=(v.options||[]).map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('');
  const teamOpts=teams.map(t=>{
    const resp=voteResponses.find(r=>r.vote_id===voteId&&r.team_id===t.id);
    return `<option value="${t.id}">${esc(t.name)}${resp?' ✓ ('+esc(resp.answer)+')':''}</option>`;
  }).join('');
  showOverlay(`<button class="close-x" onclick="closeOverlay()">×</button>
    <div class="modal-title">Record vote</div>
    <p style="font-size:13px;color:var(--text3);margin-bottom:14px;line-height:1.5">${esc(v.question)}</p>
    <div class="fg"><label>Team</label><select id="rv-team">${teamOpts}</select></div>
    <div class="fg"><label>Their answer</label><select id="rv-ans"><option value="">— pick answer —</option>${opts}</select></div>
    <div style="display:flex;gap:8px;margin-top:4px">
      <button class="btn btn-primary" onclick="submitRecordVote('${voteId}')" style="flex:1">Save vote</button>
      <button class="btn" style="color:var(--red);border-color:var(--red)" onclick="clearTeamVote('${voteId}')" style="flex:1">Clear vote</button></div>`);
}

async function submitRecordVote(voteId){
  const teamId=document.getElementById('rv-team').value;
  const answer=document.getElementById('rv-ans').value;
  if(!answer){alert('Please select an answer');return;}
  setSyncing(true);
  const {error}=await sb.from('vote_responses').upsert({vote_id:voteId,team_id:teamId,answer},{onConflict:'vote_id,team_id'});
  if(error){showToast('Error: '+error.message,'error');}
  else{showToast('Vote recorded','success');closeOverlay();await loadSeasonData(activeSeason.id);renderVotes();}
  setSyncing(false);
}

async function clearTeamVote(voteId){
  const teamId=document.getElementById('rv-team').value;
  setSyncing(true);
  await sb.from('vote_responses').delete().eq('vote_id',voteId).eq('team_id',teamId);
  showToast('Vote cleared');closeOverlay();await loadSeasonData(activeSeason.id);renderVotes();
  setSyncing(false);
}

async function toggleVoteClosed(voteId,closed){
  setSyncing(true);
  await sb.from('votes').update({closed}).eq('id',voteId);
  await loadSeasonData(activeSeason.id);renderVotes();
  setSyncing(false);
  showToast(closed?'Vote closed':'Vote reopened');
}

async function deleteVote(voteId){
  if(!confirm('Delete this vote permanently?'))return;
  setSyncing(true);
  await sb.from('votes').delete().eq('id',voteId);
  await loadSeasonData(activeSeason.id);renderVotes();
  setSyncing(false);
  showToast('Vote deleted');
}

// ── New season modal ─────────────────────────────────────────────────────────
function openNewSeasonModal(){
  const last=activeSeason;
  function nextName(n){
    const m=n.match(/(\d{4})-(\d{4})/);
    if(m)return n.replace(m[0],(parseInt(m[1])+1)+'-'+(parseInt(m[2])+1));
    const m2=n.match(/(\d{4})/);
    if(m2)return n.replace(m2[0],parseInt(m2[1])+1);
    return n+' (New)';
  }
  const suggested=last?nextName(last.name):'Fantasy League 2025';
  // Build team checkboxes safely using DOM instead of HTML strings to avoid quote/apostrophe issues
  const teamChecks=last?teams.map(t=>{
    const owners=t.owner1+(t.owner2?' & '+t.owner2:'');
    return `<label style="display:flex;align-items:center;gap:8px;padding:6px 0;cursor:pointer">`
      +`<input type="checkbox" value="${t.id}" checked style="width:auto"> `
      +`<span>${t.name}</span> `
      +`<span style="color:var(--text3);font-size:11px">(${owners})</span></label>`;
  }).join(''):'';
  const carrySection = (last && teams.length)
    ? '<div class="fg"><label style="margin-bottom:8px;display:block">Carry over teams from previous season</label>'
      + '<div style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 12px;max-height:180px;overflow-y:auto">'
      + teamChecks
      + '</div><p style="font-size:11px;color:var(--text3);margin-top:6px">Unchecked teams won\'t appear in the new season.</p></div>'
    : '';

  showOverlay(
    '<button class="close-x" onclick="closeOverlay()">×</button>'
    + '<div class="modal-title">Create new season</div>'
    + '<div class="fg"><label>Season name</label><input id="ns-name" placeholder="e.g. Bronx Degenerates 2026-2027"></div>'
    + carrySection
    + '<div class="fr">'
    + '<div class="fg"><label>Entry fee ($)</label><input id="ns-fee" type="number" value="' + (last?.entry_fee||50) + '"></div>'
    + '<div class="fg"><label>Weekly payout ($)</label><input id="ns-weekly" type="number" value="' + (last?.weekly_payout||10) + '"></div>'
    + '</div>'
    + '<div class="fr">'
    + '<div class="fg"><label>Champion payout ($)</label><input id="ns-champ" type="number" value="' + (last?.champion_payout||150) + '"></div>'
    + '<div class="fg"><label>2nd place ($)</label><input id="ns-second" type="number" value="' + (last?.second_payout||80) + '"></div>'
    + '</div>'
    + '<div class="fr">'
    + '<div class="fg"><label>3rd place ($)</label><input id="ns-third" type="number" value="' + (last?.third_payout||40) + '"></div>'
    + '<div class="fg"><label>Total weeks</label><input id="ns-weeks" type="number" value="' + (last?.total_weeks||14) + '"></div>'
    + '</div>'
    + '<button class="btn btn-primary" onclick="submitNewSeason()" style="width:100%;margin-top:4px">Create season</button>'
  );

  // Set the suggested name after the overlay renders (avoids HTML encoding issues)
  setTimeout(()=>{
    const inp = document.getElementById('ns-name');
    if(inp) inp.value = suggested;
  }, 10);
}

async function submitNewSeason(){
  const name=document.getElementById('ns-name').value.trim();
  if(!name){alert('Please enter a season name');return;}
  setSyncing(true);
  const {data:newSeason,error}=await sb.from('seasons').insert({
    name,entry_fee:parseFloat(document.getElementById('ns-fee').value)||50,
    weekly_payout:parseFloat(document.getElementById('ns-weekly').value)||10,
    champion_payout:parseFloat(document.getElementById('ns-champ').value)||150,
    second_payout:parseFloat(document.getElementById('ns-second').value)||80,
    third_payout:parseFloat(document.getElementById('ns-third').value)||40,
    total_weeks:parseInt(document.getElementById('ns-weeks').value)||14
  }).select().single();
  if(error){showToast('Error: '+error.message,'error');setSyncing(false);return;}
  // Carry over selected teams
  const checked=Array.from(document.querySelectorAll('#overlay input[type=checkbox]:checked')).map(cb=>cb.value);
  const carryTeams=teams.filter(t=>checked.includes(t.id));
  if(carryTeams.length){
    await sb.from('teams').insert(carryTeams.map(t=>({season_id:newSeason.id,name:t.name,owner1:t.owner1,owner2:t.owner2||null})));
  }
  await loadSeasons();
  activeSeason=seasons.find(s=>s.id===newSeason.id)||newSeason;
  await loadSeasonData(activeSeason.id);
  closeOverlay();renderSeasonBar();showTab('dashboard');
  showToast(`Season "${name}" created!`,'success');
  setSyncing(false);
}

// ── Toast ────────────────────────────────────────────────────────────────────
function showToast(msg,type=''){
  const c=document.getElementById('toasts');
  const t=document.createElement('div');
  t.className='toast'+(type?' '+type:'');t.textContent=msg;
  c.appendChild(t);setTimeout(()=>t.remove(),3500);
}

// ── Backup & Restore ─────────────────────────────────────────────────────────
async function downloadBackup(){
  const btn=document.querySelector('[onclick="downloadBackup()"]');
  if(btn){btn.textContent='⏳ Preparing…';btn.disabled=true;}
  try{
    setSyncing(true);
    // Pull ALL data across all seasons
    const [allSeasons, allTeams, allWr, allTx, allVotes, allVr] = await Promise.all([
      sb.from('seasons').select('*').order('created_at'),
      sb.from('teams').select('*').order('created_at'),
      sb.from('week_results').select('*').order('created_at'),
      sb.from('transactions').select('*').order('created_at'),
      sb.from('votes').select('*').order('created_at'),
      sb.from('vote_responses').select('*').order('created_at'),
    ]);
    const backup={
      version: 2,
      exported_at: new Date().toISOString(),
      app: 'Bronx Degenerates Fantasy League',
      counts:{
        seasons: allSeasons.data?.length||0,
        teams: allTeams.data?.length||0,
        transactions: allTx.data?.length||0,
        week_results: allWr.data?.length||0,
        votes: allVotes.data?.length||0,
        vote_responses: allVr.data?.length||0,
      },
      data:{
        seasons: allSeasons.data||[],
        teams: allTeams.data||[],
        week_results: allWr.data||[],
        transactions: allTx.data||[],
        votes: allVotes.data||[],
        vote_responses: allVr.data||[],
      }
    };
    const dateStr=new Date().toISOString().slice(0,10);
    const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`fantasy-league-backup-${dateStr}.json`;
    a.click();
    // Remember last backup date
    const label=dateStr+' at '+new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
    localStorage.setItem('fl_last_backup', label);
    setSyncing(false);
    showToast(`Backup downloaded — ${backup.counts.seasons} seasons, ${backup.counts.teams} teams, ${backup.counts.transactions} transactions`,'success');
    renderSettings();
  } catch(e){
    setSyncing(false);
    showToast('Backup failed: '+e.message,'error');
  }
  if(btn){btn.textContent='⬇ Download backup';btn.disabled=false;}
}

async function restoreBackup(event){
  const file=event.target.files[0];
  if(!file)return;
  event.target.value='';
  const reader=new FileReader();
  reader.onload=async(e)=>{
    let backup;
    try{ backup=JSON.parse(e.target.result); }
    catch(err){ showToast('Invalid backup file — could not read JSON','error'); return; }

    if(!backup.data||!backup.data.seasons){
      showToast('Invalid backup file — missing data structure','error'); return;
    }
    const c=backup.counts||{};
    const confirmed=confirm(
      `Restore this backup?\n\n`+
      `Exported: ${backup.exported_at?new Date(backup.exported_at).toLocaleString():'Unknown'}\n`+
      `Seasons: ${c.seasons||0}\n`+
      `Teams: ${c.teams||0}\n`+
      `Transactions: ${c.transactions||0}\n`+
      `Votes: ${c.votes||0}\n\n`+
      `⚠️ This will REPLACE all current data in Supabase.\nMake sure you downloaded a fresh backup first if needed.\n\nContinue?`
    );
    if(!confirmed)return;

    setSyncing(true);
    showToast('Restoring backup — please wait…');
    try{
      const d=backup.data;
      // Delete all existing data in reverse dependency order
      await sb.from('vote_responses').delete().neq('id','00000000-0000-0000-0000-000000000000');
      await sb.from('votes').delete().neq('id','00000000-0000-0000-0000-000000000000');
      await sb.from('transactions').delete().neq('id','00000000-0000-0000-0000-000000000000');
      await sb.from('week_results').delete().neq('id','00000000-0000-0000-0000-000000000000');
      await sb.from('teams').delete().neq('id','00000000-0000-0000-0000-000000000000');
      await sb.from('seasons').delete().neq('id','00000000-0000-0000-0000-000000000000');

      // Reinsert in dependency order
      if(d.seasons?.length)      await sb.from('seasons').insert(d.seasons);
      if(d.teams?.length)        await sb.from('teams').insert(d.teams);
      if(d.week_results?.length) await sb.from('week_results').insert(d.week_results);
      if(d.transactions?.length) await sb.from('transactions').insert(d.transactions);
      if(d.votes?.length)        await sb.from('votes').insert(d.votes);
      if(d.vote_responses?.length) await sb.from('vote_responses').insert(d.vote_responses);

      setSyncing(false);
      showToast('Backup restored successfully! Reloading…','success');
      setTimeout(()=>location.reload(), 1500);
    } catch(err){
      setSyncing(false);
      showToast('Restore failed: '+err.message,'error');
    }
  };
  reader.readAsText(file);
}

function logout() {
  sessionStorage.removeItem('fl_auth');
  location.reload();
}

// ── Auth ─────────────────────────────────────────────────────────────────────
// Password is hashed so it's not visible in plain text in the source code.
// To change the password: generate a new SHA-256 hash at sha256.online and replace the value below.
// Current password: BxDegen2025!
const PW_HASH = '2b45e9a182cd52a436ec7bfe58bd9ef7074d2ce43f98ad4129d38ab64c2aec25';

async function hashPassword(pw) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function checkLogin() {
  const pw = document.getElementById('login-pw').value;
  const err = document.getElementById('login-error');
  if (!pw) { err.textContent = 'Please enter the password'; return; }
  const hash = await hashPassword(pw);
  if (hash === PW_HASH) {
    sessionStorage.setItem('fl_auth', hash);
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('main-app').style.display = '';
    document.getElementById('season-bar').style.display = '';
    document.getElementById('main-content').style.display = '';
    err.textContent = '';
    init();
  } else {
    err.textContent = 'Incorrect password. Try again.';
    document.getElementById('login-pw').value = '';
    document.getElementById('login-pw').focus();
    // Shake animation
    const box = document.querySelector('.login-box');
    box.style.animation = 'none';
    box.offsetHeight;
    box.style.animation = 'shake .4s ease';
  }
}

async function checkSession() {
  const stored = sessionStorage.getItem('fl_auth');
  if (!stored) return false;
  return stored === PW_HASH;
}


(async function startup() {
  const authed = await checkSession();
  if (authed) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('main-app').style.display = '';
    document.getElementById('season-bar').style.display = '';
    document.getElementById('main-content').style.display = '';
    init();
  } else {
    // Show login, focus password field
    setTimeout(() => document.getElementById('login-pw').focus(), 100);
  }
})();
</script>
